name: OpenSSF Scorecard supply-chain analysis

# Free, read-only supply-chain security scoring (branch protection, maintained-ness, pinned
# dependencies, token permissions, dangerous workflow patterns, etc.) - publishes results to this
# repo's own Security tab via SARIF upload AND to the public Scorecard API
# (deps.dev/_/s/github.com/michalper/ordo), the latter only possible because this repo is public.
# No required status check, no branch-protection entry, no blast radius on any PR - purely
# informational, same spirit as this repo already has for ZAP's DAST scan.
#
# Scheduled weekly (not on every push/PR) because a score barely moves day to day and GitHub's own
# template recommends a schedule over per-push runs for exactly that reason; branch_protection_rule
# re-runs it whenever that setting changes, since Scorecard's own "Branch-Protection" check reads it
# directly.

on:
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A superseded run (an older commit on the same PR/branch) is cancelled outright rather than
# left to finish - its result would never matter once a newer commit's run exists for the same
# ref, so letting it keep consuming a runner is pure waste.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          fail_on_publish_error: true
          # Classic branch protection rules aren't readable via the default GITHUB_TOKEN, even
          # with every grantable `permissions:` scope above maxed out - Scorecard's own
          # Branch-Protection check needs read access to an API the built-in token just can't
          # reach, and silently scores -1 (error) without it instead of crediting this repo's own
          # real protections (required status checks, no force-push, no deletions). A
          # fine-grained PAT, scoped to ONLY this repo with Administration: Read-only, closes that
          # gap. See https://github.com/ossf/scorecard-action/blob/main/docs/authentication/fine-grained-auth-token.md
          repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}

      - name: Upload SARIF results to the Security tab
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          sarif_file: results.sarif
