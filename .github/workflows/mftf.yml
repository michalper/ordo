name: MFTF

# Real, full-stack acceptance tests (Test/Mftf/) — a live Magento install, MySQL, OpenSearch,
# and a real Chrome browser via Selenium, driven by the MFTF (Magento Functional Testing
# Framework) test runner. This is deliberately NOT wired to run on every push/PR like ci.yml:
# a from-scratch Magento install plus browser automation takes tens of minutes and the site
# under test lives entirely inside this one job (no separate deploy), so cost/runtime don't
# scale the way a unit-test job does. Trigger manually (Actions tab -> MFTF -> Run workflow) or
# on a schedule once this is proven stable.
#
# Split into a matrix by functional area (the strategy.matrix.group below — see each test's own
# <group> annotation in Test/Mftf/Test/*.xml) after the pipeline's first fully green run
# confirmed the shared setup itself was sound: campaign, segment, dashboard, tracking each get
# their own full Magento install + Selenium session, run concurrently, so one area's failure
# doesn't block reading the others' results and a re-run only needs to touch the group that
# actually broke.
#
# Every step below mirrors a real, already-solved pitfall — most documented in AGENTS.md's
# "Uruchomienie MFTF w tym środowisku" (local docker-compose sandbox) and "MFTF w prawdziwym CI"
# (this actual GitHub Actions environment) sections. Same two repository secrets as
# ci.yml/coverage.yml (MAGENTO_COMPOSER_USERNAME / MAGENTO_COMPOSER_PASSWORD) — see the comment
# in ci.yml for how to get them.

on:
  workflow_dispatch:

jobs:
  mftf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # One full Magento install + Selenium session per group, run concurrently — each test's
    # <group> annotation (Test/Mftf/Test/*.xml) says which of these it belongs to. Split out
    # once the single, unified pipeline had its first fully green run (run 33654687881) —
    # deliberately not before, so a real infra bug (there were several: secret-key URLs,
    # ui_component XSD violations, sendmail_path quoting, CouponGenerator's is_primary/type)
    # only ever needed diagnosing in one place, not four in parallel. fail-fast: false so one
    # group's failure doesn't cancel the others mid-run — the whole point of splitting is
    # independent, individually-readable results per area.
    strategy:
      fail-fast: false
      matrix:
        group: [campaign, segment, dashboard, tracking]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: magento
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10

      opensearch:
        image: opensearchproject/opensearch:2.19.4
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -sf http://127.0.0.1:9200/_cluster/health"
          --health-interval=10s --health-timeout=5s --health-retries=15

      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: --shm-size=2g

      mailhog:
        # Lets AdminApproveOrderViaEmailTest actually read the approve/reject email a real admin
        # would receive — Observer/HoldOrderForApproval.php only ever delivers that token by
        # email (see Test/Mftf/Helper/MailHogHelper.php's docblock), no admin grid or other UI
        # surface exposes it.
        image: mailhog/mailhog:latest
        ports:
          - 1025:1025 # SMTP — Magento's Sendmail transport is pointed at this via mhsendmail
          - 8025:8025 # HTTP API MailHogHelper reads from

    steps:
      - name: Checkout module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ordo-module

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, ftp, gd, intl, mbstring, mysqli, pdo_mysql, simplexml, soap, sodium, xsl, zip, opcache, sockets
          coverage: none

      - name: Resolve the address the selenium container can reach the host at
        # Chrome runs inside the `selenium` service container, not on the runner directly — from
        # inside that container 127.0.0.1 is its own loopback, not the runner's, so Magento's
        # base URL can't be 127.0.0.1 or the browser gets net::ERR_CONNECTION_REFUSED on every
        # single page load (confirmed directly: curl from inside the selenium container to
        # 127.0.0.1:8080 refuses, to host.docker.internal doesn't resolve, but to docker0's
        # gateway address gets a real response from nginx). The runner's own processes (this
        # workflow's REST-based createData/deleteEntity calls, health-check curls) keep using
        # 127.0.0.1 — only the browser-facing base URL needs to change.
        run: echo "SELENIUM_REACHABLE_HOST=$(ip -4 addr show docker0 | grep -oP '(?<=inet\s)\d+(\.\d+){3}')" >> "$GITHUB_ENV"

      - name: Remove shivammathur/setup-php's ambient GitHub auth
        # setup-php configures Composer's global github-oauth.github.com with GITHUB_TOKEN by
        # default, purely to avoid GitHub API rate-limit errors during `composer install`. Fifth
        # real run failed at generate:tests with "Suite Data Parser Error: Your github oauth
        # token for github.com contains invalid characters" — MFTF's suite parser reads that same
        # global token for its own (unrelated to us) purposes and chokes on it. Nothing in this
        # workflow needs GitHub API auth (only repo.magento.com and a local path repo), so just
        # remove it.
        run: composer config --global --unset github-oauth.github.com || true

      - name: Checkout Magento 2.4.9
        run: git clone --branch 2.4.9 --depth 1 https://github.com/magento/magento2.git magento

      - name: Configure Composer for repo.magento.com and the local module
        working-directory: magento
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          # symlink:false — a plain `path ../ordo-module` repo defaults to a symlinked install,
          # and static:content:deploy's path validation rejects a template file whose realpath
          # escapes the Magento root through that symlink ("Path ... cannot be used with
          # directory ..."), exactly the same failure this repo's local magento-ordo-test/
          # sandbox hit and fixed the same way.
          composer config repositories.ordo-automation '{"type":"path","url":"../ordo-module","options":{"symlink":false}}'
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
      - name: Require the local module
        working-directory: magento
        # `composer require` (not `update`) — it resolves and locks only the newly added package
        # against the existing committed composer.lock as its baseline, rather than the broader
        # `composer update <pkg> --with-dependencies` invocation SonarCloud's githubactions:S8546
        # flags as not lock-enforcing. Scoped to just this one package so the rest of Magento
        # 2.4.9's own lock file stays pinned/predictable.
        run: composer require ordo/module-automation:@dev --no-interaction --no-progress

      - name: Install Magento
        working-directory: magento
        run: |
          bin/magento setup:install \
            --base-url=http://${SELENIUM_REACHABLE_HOST}:8080/ \
            --db-host=127.0.0.1 --db-name=magento --db-user=root \
            --admin-firstname=Admin --admin-lastname=User \
            --admin-email=admin@example.com --admin-user=admin --admin-password='Admin123!' \
            --language=en_US --currency=USD --timezone=America/Chicago \
            --use-rewrites=1 \
            --search-engine=opensearch --opensearch-host=127.0.0.1 --opensearch-port=9200 \
            --backend-frontname=admin

          bin/magento module:enable Ordo_Automation
          bin/magento setup:upgrade
          bin/magento deploy:mode:set developer

          # StorefrontTrackerSetsVisitorCookieTest explicitly documents (see its own test XML)
          # that it assumes this is already on — true of the long-lived local sandbox this suite
          # was originally written/verified against, not of a from-scratch install like this one.
          bin/magento config:set ordo_automation/tracking/enabled 1
          # AdminApproveOrderViaEmailTest needs order-hold-for-approval actually active.
          bin/magento config:set ordo_automation/order_approval/enabled 1
          # AdminScoreThresholdCampaignTest needs Observer/EvaluateCustomerScoreRules.php to
          # actually run on customer_save_after — off by default, same as the two flags above.
          bin/magento config:set ordo_automation/lead_scoring/enabled 1

          # Every admin test that navigates straight to a URL (amOnPage) rather than
          # clicking a rendered link was silently redirected to the Dashboard — confirmed
          # via curl repro: the Location header carried a /key/<hash>/ segment, proof that
          # "Add Secret Key to URLs" (on by default, see module-store's config.xml) was
          # rejecting the keyless direct navigation and bouncing to getStartupPageUrl()
          # with no error message. ACL was already proven fine (see the dump below).
          bin/magento config:set admin/security/use_form_key 0

          # Newly-created MFTF test fixtures (products, etc.) aren't salable/addable to cart
          # until stock/price indexes recompute — set once globally instead of forcing a
          # reindex in every test. Deliberately excludes catalogsearch_fulltext: no test here
          # needs it, and it cascades on OpenSearch hiccups.
          bin/magento indexer:set-mode realtime cataloginventory_stock catalog_product_price \
            catalog_product_attribute catalog_category_product catalog_product_category

          bin/magento setup:static-content:deploy -f en_US -a adminhtml
          bin/magento setup:static-content:deploy -f en_US -a frontend
          bin/magento cache:flush

      - name: Build the MFTF project
        working-directory: magento
        # `mftf build:project` scaffolds dev/tests/acceptance/ (utils/command.php, .env.example,
        # codeception config, etc.) from magento/magento2-functional-testing-framework's own
        # templates — magento/magento2 doesn't ship any of dev/tests/acceptance/utils itself
        # (confirmed: that directory only has .gitignore/.htaccess.sample/staticRuleset.json/tests/
        # in the core repo). Must run before anything below that references its output (the
        # CLI-bridge symlink or .env).
        run: vendor/bin/mftf build:project

      - name: Install nginx and PHP-FPM
        # PHP's built-in development server (`php -S`) is explicitly not designed for concurrent
        # traffic — runs 1 through 7 of this workflow all failed identically with
        # net::ERR_CONNECTION_REFUSED partway into a real browser session (confirmed via
        # php-server.log: the server process itself stayed alive and kept accepting connections
        # throughout, so this wasn't a crash), even after bumping PHP_CLI_SERVER_WORKERS from 8 to
        # 32. Selenium/Chrome's real concurrent asset-fetching load needs a real web server —
        # nginx + php-fpm, the same stack Magento's own docs and official CI actually use, is the
        # correct fix rather than continuing to tune the dev server's worker count. ubuntu-24.04's
        # default apt PHP is already 8.3, matching the CLI version installed above.
        run: |
          sudo apt-get update -qq
          # sodium isn't a separate apt package — it's bundled into PHP core since 7.2.
          sudo apt-get install -y -qq nginx php8.3-fpm php8.3-bcmath php8.3-curl php8.3-gd \
            php8.3-intl php8.3-mbstring php8.3-mysql php8.3-soap php8.3-xsl \
            php8.3-zip php8.3-opcache

      - name: Configure and start nginx + PHP-FPM for Magento
        working-directory: magento
        # Magento ships its own reference nginx vhost (nginx.conf.sample, $MAGE_ROOT-parameterized)
        # instead of a hand-rolled router — reusing it means Magento's actual, maintained rewrite
        # rules (setup app, static/media handling, GraphQL, etc.), not a partial reimplementation.
        run: |
          sudo tee /etc/nginx/sites-available/magento.conf > /dev/null <<NGINX
          server {
              listen 8080;
              server_name ${SELENIUM_REACHABLE_HOST};
              set \$MAGE_ROOT $(pwd);
              set \$MAGE_MODE developer;

              # Must come BEFORE the include below — nginx tries regex locations in file order
              # and stops at the first match, and nginx.conf.sample's own catch-all
              # (location ~* (\.php\$|...) { deny all }) would otherwise shadow this one, since
              # cli-bridge/a/b/command.php isn't in that file's PHP entry-point whitelist
              # (index|get|static|errors/*|health_check).
              location ~ ^/cli-bridge/.*\.php\$ {
                  root $(pwd)/pub;
                  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
                  fastcgi_index index.php;
                  fastcgi_param SCRIPT_FILENAME \$document_root\$fastcgi_script_name;
                  include fastcgi_params;
              }

              include $(pwd)/nginx.conf.sample;
          }
          NGINX
          sudo sed -i "s#fastcgi_pass   fastcgi_backend;#fastcgi_pass unix:/run/php/php8.3-fpm.sock;#" nginx.conf.sample
          sudo ln -sf /etc/nginx/sites-available/magento.conf /etc/nginx/sites-enabled/magento.conf
          sudo rm -f /etc/nginx/sites-enabled/default

          # Both nginx's worker processes and PHP-FPM's pool default to www-data, but the whole
          # Magento tree (including setup:install's own output — var/, generated/, pub/static/,
          # app/etc/env.php) is owned by this job's own runner user under /home/runner/work/...,
          # which isn't traversable by www-data at all (confirmed via nginx's error.log: "stat()
          # ...magento/pub/ failed (13: Permission denied)" — a directory-traversal failure, not
          # just a single-file permissions issue). Run both as the runner user instead of
          # chown-ing the whole tree to www-data (which would then need undoing for the CLI steps
          # below that still run as the runner user directly, e.g. the magentoCLI bridge's exec()
          # calls).
          sudo sed -i "s/^user www-data;/user $(whoami);/" /etc/nginx/nginx.conf
          sudo sed -i "s/^user = .*/user = $(whoami)/; s/^group = .*/group = $(whoami)/" \
            /etc/php/8.3/fpm/pool.d/www.conf
          sudo sed -i "s/^listen.owner = .*/listen.owner = $(whoami)/; s/^listen.group = .*/listen.group = $(whoami)/" \
            /etc/php/8.3/fpm/pool.d/www.conf
          # Ubuntu's default pool caps at pm.max_children = 5 — nowhere near enough for the
          # burst of concurrent asset requests a real admin page triggers under Selenium/Chrome
          # (the same class of problem PHP_CLI_SERVER_WORKERS existed to solve for php -S).
          # static + a flat 32 avoids dynamic's slower ramp-up (start_servers/min_spare_servers)
          # costing the first page load extra latency.
          sudo sed -i "s/^pm = .*/pm = static/; s/^pm.max_children = .*/pm.max_children = 32/" \
            /etc/php/8.3/fpm/pool.d/www.conf

          # Routes PHP's mail() (Magento's default Sendmail transport — this module sets no SMTP
          # config of its own) into MailHog instead of trying (and failing) to actually send.
          # mhsendmail is a tiny sendmail-compatible binary purpose-built for exactly this.
          sudo curl -sfL -o /usr/local/bin/mhsendmail \
            https://github.com/mailhog/mhsendmail/releases/download/v0.2.0/mhsendmail_linux_amd64
          sudo chmod +x /usr/local/bin/mhsendmail
          # Symfony's SendmailTransport (Magento's Sendmail\Model\Transport::createSendmailTransport())
          # rejects any sendmail_path whose flags don't contain a literal " -bs" or " -t" — confirmed
          # via a real CI failure: "Unsupported sendmail command flags ... must be one of -bs or -t"
          # on every single outgoing email (order-approval, coupon-generation notices, etc.), which in
          # turn made AdminApproveOrderViaEmailTest fail with "MailHog has no messages". "-bs" would
          # switch Symfony into its own interactive SMTP-stream mode, which mhsendmail doesn't
          # speak — mhsendmail only supports being invoked as a plain sendmail command over stdin, so
          # "-t" (accepted by mhsendmail as a no-op flag) is the one that actually works.
          # The value MUST be quoted — confirmed via a real CI run that PHP's ini parser
          # truncates an unquoted value at the embedded "=" inside --smtp-addr=..., silently
          # dropping everything from "=127.0.0.1:1025" onward (including the "-t" above),
          # which is exactly what left the very first fix still failing the same way.
          echo 'sendmail_path = "/usr/local/bin/mhsendmail --smtp-addr=127.0.0.1:1025 -t"' | \
            sudo tee /etc/php/8.3/fpm/conf.d/99-mhsendmail.ini > /dev/null

          sudo nginx -t
          sudo systemctl restart php8.3-fpm
          sudo systemctl restart nginx
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8080/ -o /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/ -o /dev/null || (
            echo "--- curl -v ---"; curl -v http://127.0.0.1:8080/ 2>&1
            echo "--- nginx error.log ---"; sudo tail -100 /var/log/nginx/error.log
            echo "--- php8.3-fpm error log ---"; sudo tail -100 /var/log/php8.3-fpm.log
            exit 1
          )

      - name: Warm the layout cache with serial requests before Selenium's concurrent load
        # Magento's own application logs (var/log/system.log) on a failed run showed "Broken
        # reference" warnings for the most basic layout containers (header, footer,
        # page.formkey, page.messages) on EVERY page — admin AND storefront — right from the
        # very first requests after a fresh cache:flush. That's consistent with a cold-cache
        # stampede: pm.max_children=32 means up to 32 PHP-FPM workers can race to regenerate the
        # same merged-layout cache file simultaneously on the very first hits, corrupting it.
        # Force that regeneration to happen exactly once, serially, before Selenium's real
        # concurrent asset-fetching load ever starts.
        working-directory: magento
        run: |
          curl -sf "http://${SELENIUM_REACHABLE_HOST}:8080/" -o /dev/null
          curl -sf "http://${SELENIUM_REACHABLE_HOST}:8080/admin/admin/" -o /dev/null

      - name: Wire the MFTF CLI bridge and .env
        working-directory: magento
        run: |
          # <magentoCLI> MFTF actions POST to this path. command.php locates bin/magento via 4x
          # "../" from its own directory — this symlink sits exactly 3 levels under pub/ so that
          # resolves back to the Magento root. See AGENTS.md for how this depth requirement was
          # originally worked out (against PHP's built-in dev server, since replaced by nginx +
          # PHP-FPM above — kept the same depth here since it's still correct and nothing forces
          # a change).
          mkdir -p pub/cli-bridge/a/b
          ln -sf "$(pwd)/dev/tests/acceptance/utils/command.php" pub/cli-bridge/a/b/command.php

          cat >> dev/tests/acceptance/.env <<EOF
          MAGENTO_BASE_URL=http://${SELENIUM_REACHABLE_HOST}:8080/
          MAGENTO_BACKEND_NAME=admin
          MAGENTO_CLI_COMMAND_PATH=cli-bridge/a/b/command.php
          MAGENTO_CLI_COMMAND_PARAMETER=command
          MAGENTO_ADMIN_USERNAME=admin
          MAGENTO_ADMIN_PASSWORD=Admin123!
          SELENIUM_HOST=127.0.0.1
          SELENIUM_PORT=4444
          BROWSER=chrome
          MODULE_ALLOWLIST=Ordo_Automation
          EOF

          # Not used by anything this workflow actually tests — none of this repo's own tests
          # need a credential — but `mftf generate:tests`/`run:group` parses EVERY Suite XML
          # Magento core ships (e.g. the TwoFactorAuth module's default backend suite references
          # {{_CREDS.magento/tfa/OTP_SHARED_SECRET}}) regardless of which group was asked for,
          # and fails outright ("Password not found in credentials file") if the file is simply
          # missing. Dummy values are fine: nothing here reads them for real.
          cat > dev/tests/acceptance/.credentials <<'EOF'
          magento/tfa/OTP_SHARED_SECRET=dummy
          magento/MAGENTO_ADMIN_PASSWORD=Admin123!
          EOF

      - name: Run MFTF tests
        # run:group both generates and executes every test carrying this <group> annotation —
        # no separate generate step needed (unlike the old run:test invocation this replaced).
        working-directory: magento
        run: vendor/bin/mftf run:group ${{ matrix.group }}

      - name: Copy nginx/PHP-FPM logs for the failure artifact
        if: failure()
        run: |
          mkdir -p /tmp/server-logs
          sudo cp /var/log/nginx/error.log /tmp/server-logs/nginx-error.log 2>/dev/null || true
          sudo cp /var/log/nginx/access.log /tmp/server-logs/nginx-access.log 2>/dev/null || true
          sudo cp /var/log/php8.3-fpm.log /tmp/server-logs/php8.3-fpm.log 2>/dev/null || true
          sudo chmod -R a+r /tmp/server-logs

      - name: Dump ACL data and Magento's own logs for the failure artifact
        # Run 16's authorization_role/authorization_rule dump came back exactly as a correct,
        # full-access "Administrators" role should (Magento_Backend::all = allow) — ACL grants
        # are not the problem. Every Ordo_Automation admin controller has redirected to
        # Magento's own default dashboard since run 14 (confirmed by re-checking that run's own
        # access log), 100% of the time, immediately on every request — not a timing flake.
        # Magento's own application logs (exception.log/system.log/debug.log), never checked so
        # far, are the obvious next place an unexplained redirect like this would show up.
        if: failure()
        working-directory: magento
        run: |
          mysql -h127.0.0.1 -uroot magento -e "SELECT * FROM authorization_role;" > /tmp/server-logs/authorization_role.txt 2>&1 || true
          mysql -h127.0.0.1 -uroot magento -e "SELECT * FROM authorization_rule;" > /tmp/server-logs/authorization_rule.txt 2>&1 || true
          # AdminCampaignScenarioEndToEndTest: the campaign form saves fine ("has been saved"
          # message appears) and the consumer CLI call exits successfully, but the coupon it
          # should generate never shows up in the rule's grid, with zero errors logged anywhere
          # — consistent with CampaignDispatcher silently finding 0 enabled campaigns for the
          # trigger (its normal, non-error no-op path). These four tables are the ground truth
          # for whether "enabled" and the trigger/condition/action rows actually persisted the
          # way the UI claimed — the campaign itself is UI-created, not an MFTF createData
          # fixture, so nothing deletes it before this step runs.
          mysql -h127.0.0.1 -uroot magento -e "SELECT * FROM ordo_campaign;" > /tmp/server-logs/ordo_campaign.txt 2>&1 || true
          mysql -h127.0.0.1 -uroot magento -e "SELECT * FROM ordo_campaign_trigger;" > /tmp/server-logs/ordo_campaign_trigger.txt 2>&1 || true
          mysql -h127.0.0.1 -uroot magento -e "SELECT * FROM ordo_campaign_condition;" > /tmp/server-logs/ordo_campaign_condition.txt 2>&1 || true
          mysql -h127.0.0.1 -uroot magento -e "SELECT * FROM ordo_campaign_action;" > /tmp/server-logs/ordo_campaign_action.txt 2>&1 || true
          # Splits the remaining mystery in two: if a coupon row exists here, generation
          # actually worked and this is purely an admin-grid display bug; if not, the
          # trigger->condition->action chain (or the DB queue message that starts it) never ran.
          mysql -h127.0.0.1 -uroot magento -e "SELECT * FROM salesrule_coupon WHERE code LIKE 'E2ETEST-%';" > /tmp/server-logs/salesrule_coupon.txt 2>&1 || true
          # The DB queue driver's own message/status tables — confirms whether
          # CampaignDispatchPublisher::publish() actually enqueued anything at all, and if so
          # whether the consumer picked it up (status: 'complete') or errored (status: 'error').
          # Table/column names unconfirmed locally (this module's own vendor/ tree doesn't carry
          # the full Magento app the DB queue driver ships in) — SHOW TABLES first so a wrong
          # guess at exact names doesn't waste the run, then dump whatever queue-related tables
          # actually exist without assuming a join key.
          mysql -h127.0.0.1 -uroot magento -e "SHOW TABLES LIKE 'queue%';" > /tmp/server-logs/queue_tables.txt 2>&1 || true
          mysql -h127.0.0.1 -uroot magento -e "SELECT * FROM queue;" >> /tmp/server-logs/queue_tables.txt 2>&1 || true
          mysql -h127.0.0.1 -uroot magento -e "SELECT * FROM queue_message ORDER BY id DESC LIMIT 20;" >> /tmp/server-logs/queue_tables.txt 2>&1 || true
          mysql -h127.0.0.1 -uroot magento -e "SELECT * FROM queue_message_status ORDER BY updated_at DESC LIMIT 20;" >> /tmp/server-logs/queue_tables.txt 2>&1 || true
          cp var/log/exception.log /tmp/server-logs/magento-exception.log 2>/dev/null || true
          cp var/log/system.log /tmp/server-logs/magento-system.log 2>/dev/null || true
          cp var/log/debug.log /tmp/server-logs/magento-debug.log 2>/dev/null || true
          bin/magento module:status > /tmp/server-logs/module-status.txt 2>&1 || true

      - name: Reproduce the redirect via curl and dump raw response headers
        # ACL is provably fine, the "Broken reference" layout warnings are unchanged whether the
        # cache is pre-warmed or not (206 either way) — neither explains the redirect. Logging
        # in exactly like Selenium does and hitting the same failing URL directly from this same
        # runner gets the actual Location/Set-Cookie headers Chrome never exposes to us, instead
        # of guessing at a fifth theory.
        if: failure()
        run: |
          BASE="http://${SELENIUM_REACHABLE_HOST}:8080"
          JAR=/tmp/server-logs/cookies.txt
          FORM_KEY=$(curl -s -c "$JAR" "$BASE/admin/admin/" | grep -oP "name=\"form_key\"\s+type=\"hidden\"\s+value=\"\K[^\"]+" | head -1)
          echo "form_key: $FORM_KEY" > /tmp/server-logs/curl-repro.txt
          curl -s -b "$JAR" -c "$JAR" -D - -o /tmp/server-logs/curl-login-body.html \
            --data-urlencode "login[username]=admin" --data-urlencode "login[password]=Admin123!" \
            --data-urlencode "form_key=$FORM_KEY" "$BASE/admin/admin/index/index/" \
            >> /tmp/server-logs/curl-repro.txt
          echo "--- GET campaign/new ---" >> /tmp/server-logs/curl-repro.txt
          curl -s -b "$JAR" -c "$JAR" -D - -o /tmp/server-logs/curl-campaign-new-body.html \
            "$BASE/admin/ordo/campaign/new" >> /tmp/server-logs/curl-repro.txt
          echo "--- GET campaign/new, following redirects to the real final page ---" >> /tmp/server-logs/curl-repro.txt
          curl -sL -b "$JAR" -c "$JAR" -o /tmp/server-logs/curl-campaign-new-final.html \
            "$BASE/admin/ordo/campaign/new"
          # Flash messages (the "why" behind whatever page we actually landed on) and the module
          # list Magento itself believes is active, straight from the live instance rather than
          # inferred from install-time logs.
          grep -oE '<li[^>]*class="[^"]*message-(error|warning)[^"]*"[^>]*>.*</li>' \
            /tmp/server-logs/curl-campaign-new-final.html >> /tmp/server-logs/curl-repro.txt 2>/dev/null || true
          cat /tmp/server-logs/cookies.txt >> /tmp/server-logs/curl-repro.txt 2>/dev/null || true

      - name: Upload MFTF results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Suffixed per matrix group — four parallel jobs uploading the same artifact name
          # would otherwise collide.
          name: mftf-results-${{ matrix.group }}
          path: |
            magento/dev/tests/acceptance/tests/_output
            /tmp/server-logs
          retention-days: 7
