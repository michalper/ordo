name: MFTF

# Real, full-stack acceptance tests (Test/Mftf/) — a live Magento install, MySQL, OpenSearch,
# and a real Chrome browser via Selenium, driven by the MFTF (Magento Functional Testing
# Framework) test runner. This is deliberately NOT wired to run on every push/PR like ci.yml:
# a from-scratch Magento install plus browser automation takes tens of minutes and the site
# under test lives entirely inside this one job (no separate deploy), so cost/runtime don't
# scale the way a unit-test job does. Trigger manually (Actions tab -> MFTF -> Run workflow) or
# on a schedule once this is proven stable.
#
# Every step below mirrors a real, already-solved pitfall documented in AGENTS.md's "Uruchomienie
# MFTF w tym środowisku" section, discovered running these exact tests locally in
# magento-ordo-test/ (PHP_CLI_SERVER_WORKERS, static content deploy, the cli-bridge symlink,
# realtime indexers). Same two repository secrets as ci.yml/coverage.yml
# (MAGENTO_COMPOSER_USERNAME / MAGENTO_COMPOSER_PASSWORD) — see the comment in ci.yml for how to
# get them.
#
# NOT yet verified end-to-end in GitHub Actions itself (unlike every other workflow in this repo,
# which was iterated against real CI runs) — a full Magento install + Selenium session in a fresh
# runner has a wide surface area (service container health-check timing, network reachability
# between the runner and service containers, disk space) that's realistically only fully proven by
# actually running it and fixing whatever breaks, the same way the local pitfalls list was built.

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Space-separated MFTF test names to run (default: the full suite)"
        required: false
        default: >-
          AdminCreateCampaignTest AdminCreateSegmentTest AdminCreateMultiTriggerCampaignTest
          AdminCreateCampaignWithConditionsAndActionsTest AdminViewDashboardTest
          AdminViewReorderCyclesGridTest StorefrontTrackerSetsVisitorCookieTest
          AdminCampaignScenarioEndToEndTest

jobs:
  mftf:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: magento
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10

      opensearch:
        image: opensearchproject/opensearch:2.19.4
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -sf http://127.0.0.1:9200/_cluster/health"
          --health-interval=10s --health-timeout=5s --health-retries=15

      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: --shm-size=2g

    steps:
      - name: Checkout module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ordo-module

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, ftp, gd, intl, mbstring, mysqli, pdo_mysql, simplexml, soap, sodium, xsl, zip, opcache, sockets
          coverage: none

      - name: Remove shivammathur/setup-php's ambient GitHub auth
        # setup-php configures Composer's global github-oauth.github.com with GITHUB_TOKEN by
        # default, purely to avoid GitHub API rate-limit errors during `composer install`. Fifth
        # real run failed at generate:tests with "Suite Data Parser Error: Your github oauth
        # token for github.com contains invalid characters" — MFTF's suite parser reads that same
        # global token for its own (unrelated to us) purposes and chokes on it. Nothing in this
        # workflow needs GitHub API auth (only repo.magento.com and a local path repo), so just
        # remove it.
        run: composer config --global --unset github-oauth.github.com || true

      - name: Checkout Magento 2.4.9
        run: git clone --branch 2.4.9 --depth 1 https://github.com/magento/magento2.git magento

      - name: Configure Composer for repo.magento.com and the local module
        working-directory: magento
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          # symlink:false — a plain `path ../ordo-module` repo defaults to a symlinked install,
          # and static:content:deploy's path validation rejects a template file whose realpath
          # escapes the Magento root through that symlink ("Path ... cannot be used with
          # directory ..."), exactly the same failure this repo's local magento-ordo-test/
          # sandbox hit and fixed the same way.
          composer config repositories.ordo-automation '{"type":"path","url":"../ordo-module","options":{"symlink":false}}'
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
      - name: Require the local module
        working-directory: magento
        # `composer require` (not `update`) — it resolves and locks only the newly added package
        # against the existing committed composer.lock as its baseline, rather than the broader
        # `composer update <pkg> --with-dependencies` invocation SonarCloud's githubactions:S8546
        # flags as not lock-enforcing. Scoped to just this one package so the rest of Magento
        # 2.4.9's own lock file stays pinned/predictable.
        run: composer require ordo/module-automation:@dev --no-interaction --no-progress

      - name: Install Magento
        working-directory: magento
        run: |
          bin/magento setup:install \
            --base-url=http://127.0.0.1:8080/ \
            --db-host=127.0.0.1 --db-name=magento --db-user=root \
            --admin-firstname=Admin --admin-lastname=User \
            --admin-email=admin@example.com --admin-user=admin --admin-password='Admin123!' \
            --language=en_US --currency=USD --timezone=America/Chicago \
            --use-rewrites=1 \
            --search-engine=opensearch --opensearch-host=127.0.0.1 --opensearch-port=9200 \
            --backend-frontname=admin

          bin/magento module:enable Ordo_Automation
          bin/magento setup:upgrade
          bin/magento deploy:mode:set developer

          # Newly-created MFTF test fixtures (products, etc.) aren't salable/addable to cart
          # until stock/price indexes recompute — set once globally instead of forcing a
          # reindex in every test. Deliberately excludes catalogsearch_fulltext: no test here
          # needs it, and it cascades on OpenSearch hiccups.
          bin/magento indexer:set-mode realtime cataloginventory_stock catalog_product_price \
            catalog_product_attribute catalog_category_product catalog_product_category

          bin/magento setup:static-content:deploy -f en_US -a adminhtml
          bin/magento setup:static-content:deploy -f en_US -a frontend
          bin/magento cache:flush

      - name: Build the MFTF project
        working-directory: magento
        # `mftf build:project` scaffolds dev/tests/acceptance/ (utils/command.php, .env.example,
        # codeception config, etc.) from magento/magento2-functional-testing-framework's own
        # templates — magento/magento2 doesn't ship any of dev/tests/acceptance/utils itself
        # (confirmed: that directory only has .gitignore/.htaccess.sample/staticRuleset.json/tests/
        # in the core repo). Must run before anything below that references its output (the
        # CLI-bridge symlink or .env).
        run: vendor/bin/mftf build:project

      - name: Write the PHP built-in server's router script
        working-directory: magento
        # PHP's built-in server needs an explicit router when serving Magento's pub/ docroot,
        # since Magento's real .htaccess/nginx rewrite rules (everything that isn't a real static
        # file goes to index.php) have no equivalent here. This script is NOT something MFTF or
        # Magento ships anywhere — it doesn't exist in either repo — so it's authored directly
        # here rather than assumed to come from mftf build:project (an earlier version of this
        # workflow wrongly assumed dev/tests/acceptance/utils/router.php would be scaffolded by
        # that command; it never was, causing "Failed opening required '.../router.php'").
        run: |
          cat > /tmp/router.php <<'PHP'
          <?php
          $root = $_SERVER['DOCUMENT_ROOT'];
          $path = urldecode(parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH));
          $file = $root . $path;
          if ($path !== '/' && is_file($file)) {
              return false;
          }
          chdir($root);
          require $root . '/index.php';
          PHP

      - name: Wire the MFTF CLI bridge and .env
        working-directory: magento
        run: |
          # <magentoCLI> MFTF actions POST to this path; it must resolve to exactly 3 directory
          # levels under pub/ because command.php locates bin/magento via 4x "../" relative to
          # the PHP built-in server's CWD (docroot + request path), not the symlink's real
          # location. See AGENTS.md for how this was worked out.
          mkdir -p pub/cli-bridge/a/b
          ln -sf "$(pwd)/dev/tests/acceptance/utils/command.php" pub/cli-bridge/a/b/command.php

          cat >> dev/tests/acceptance/.env <<'EOF'
          MAGENTO_BASE_URL=http://127.0.0.1:8080/
          MAGENTO_BACKEND_NAME=admin
          MAGENTO_CLI_COMMAND_PATH=cli-bridge/a/b/command.php
          MAGENTO_CLI_COMMAND_PARAMETER=command
          MAGENTO_ADMIN_USERNAME=admin
          MAGENTO_ADMIN_PASSWORD=Admin123!
          SELENIUM_HOST=127.0.0.1
          SELENIUM_PORT=4444
          BROWSER=chrome
          MODULE_ALLOWLIST=Ordo_Automation
          EOF

          # Not used by anything this workflow actually tests — none of the tests in `inputs.tests`
          # need a credential — but `mftf generate:tests` parses EVERY Suite XML Magento core ships
          # (e.g. the TwoFactorAuth module's default backend suite references
          # {{_CREDS.magento/tfa/OTP_SHARED_SECRET}}) regardless of which tests were asked for, and
          # fails outright ("Password not found in credentials file") if the file is simply missing.
          # Dummy values are fine: nothing here reads them for real.
          cat > dev/tests/acceptance/.credentials <<'EOF'
          magento/tfa/OTP_SHARED_SECRET=dummy
          magento/MAGENTO_ADMIN_PASSWORD=Admin123!
          EOF

      - name: Start PHP built-in server
        working-directory: magento
        env:
          # Mandatory: the built-in server otherwise handles one request at a time, and
          # Selenium/Chrome fires many concurrent asset requests — without workers, admin pages
          # render with broken assets (RequireJS "Script error") or hang until timeout. Bumped
          # from 8 to 32 after the first real run: every one of the 8 tests failed identically at
          # the exact same point (the post-login page's asset burst / the logout page's re-render)
          # with net::ERR_CONNECTION_REFUSED — php-server.log showed the server still alive and
          # accepting connections throughout, so this wasn't a crash, just too few workers for the
          # concurrent request burst a full admin page triggers.
          PHP_CLI_SERVER_WORKERS: 32
        run: |
          nohup php -S 0.0.0.0:8080 -t pub /tmp/router.php \
            > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 15); do
            curl -sf http://127.0.0.1:8080/ -o /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/ -o /dev/null || (cat /tmp/php-server.log && exit 1)

      - name: Generate MFTF tests
        working-directory: magento
        env:
          MFTF_TESTS: ${{ inputs.tests }}
        run: vendor/bin/mftf generate:tests $MFTF_TESTS

      - name: Run MFTF tests
        working-directory: magento
        env:
          MFTF_TESTS: ${{ inputs.tests }}
        run: vendor/bin/mftf run:test $MFTF_TESTS

      - name: Upload MFTF results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mftf-results
          path: |
            magento/dev/tests/acceptance/tests/_output
            /tmp/php-server.log
          retention-days: 7
