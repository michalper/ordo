name: CI

# Fast lane only: unit tests (Test/Unit) and static analysis. Neither needs a live Magento
# install — Test/Unit mocks every Magento dependency, and PHPStan (bitexpert/phpstan-magento)
# only needs the framework/module *classes* available via Composer, not a running store.
# Test/Integration, Test/Api, and MFTF are NOT run here: they require a real, installed Magento
# application (database, env.php, and for MFTF a browser + webserver) — see AGENTS.md for how to
# run those against the docker-compose environment in magento-ordo-test/. Test/Integration and
# Test/Api each have their own dedicated workflow (integration-tests.yml, api-tests.yml); MFTF's
# is mftf.yml. Wiring a full Magento install into THIS workflow is still a deliberate non-goal
# (build time, service containers) — that's what those separate workflows are for.
#
# Requires two repository secrets — MAGENTO_COMPOSER_USERNAME / MAGENTO_COMPOSER_PASSWORD —
# because magento/framework and magento/module-* are not on public Packagist, only on
# repo.magento.com. Get a free public/private key pair from a Marketplace account at
# https://marketplace.magento.com (Home → My Profile → Access Keys), no purchase required for
# Open Source packages. Add them as Settings → Secrets and variables → Actions → New repository
# secret. Without them, the "Install dependencies" step below fails with a 401 from
# repo.magento.com — that's expected until the secrets are set, not a bug in this workflow.
#
# Single PR trigger path: pull_request, the normal, safe path for anyone's PR — a plain
# pull_request run from an ordinary contributor gets no secrets at all, which is what makes it
# safe to run untrusted PR code. We previously tried pull_request_target (runs with secrets, gated
# to Dependabot PRs only) so Dependabot's composer-ecosystem PRs could actually verify against
# repo.magento.com, but SonarCloud's githubactions:S7631 flags checking out a PR's head ref under
# pull_request_target categorically — the rule fires on the pattern itself, not on how well the
# actor is verified, so no guard strengthening clears it. Reverted to plain pull_request.
#
# A Dependabot-triggered pull_request run is a separate case: GitHub resolves secrets.* for it
# from the repo's Dependabot secret store (Settings -> Secrets and variables -> Dependabot), not
# the Actions one — not withheld outright, as a now-corrected earlier version of this comment and
# dependabot.yml's claimed. MAGENTO_COMPOSER_USERNAME/PASSWORD are in both stores (see
# dependabot.yml's registries: block), so Install dependencies already succeeds for every
# Dependabot PR regardless of ecosystem. See ADR 0074.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least-privilege default (OpenSSF Scorecard's Token-Permissions check) - nothing in this
# workflow needs more than reading the checked-out code.
permissions:
  contents: read

# A superseded run (an older commit on the same PR/branch) is cancelled outright rather than
# left to finish - its result would never matter once a newer commit's run exists for the same
# ref, so letting it keep consuming a runner is pure waste.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Detects whether this push/PR touches anything besides Markdown docs (README/ROADMAP/
    # docs/**/*.md) - a docs-only PR has no way to affect any of this workflow's own test/lint
    # results, so every real job below skips entirely rather than re-running the exact same
    # PHP suite against unchanged code. Only trusted on pull_request (dorny/paths-filter's own
    # GitHub-API-based diff, no git history needed) - a push straight to main (almost always a
    # squash-merge of an already-reviewed PR) always runs the full suite regardless, so a
    # misdetected diff on that rarer, more consequential path is never a risk.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code || steps.default.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect whether anything besides Markdown docs changed
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - '!**/*.md'

      - name: Default to "code changed" for non-pull_request events
        id: default
        if: github.event_name != 'pull_request'
        run: echo "code=true" >> "$GITHUB_OUTPUT"

  unit-tests-php:
    # Matrix across composer.json's whole declared range (">=8.3 <8.6"), not just the 8.4 the
    # rest of this workflow's jobs run on — phpstan/rector/phpcs check *syntax*/types, which
    # don't vary by which PHP actually executes them, but PHPUnit here really runs the code, so
    # this is the one job where a PHP-8.3-only or 8.5-only regression could otherwise slip
    # through untested until a real install on that version hit it.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4", "8.5"]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Configure Composer for repo.magento.com
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.infection/extension-installer true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies for known vulnerabilities
        # --abandoned=report: still shown, but doesn't fail the build — the abandoned packages
        # here are transitive dependencies of magento/magento2-functional-testing-framework
        # (laminas/*, doctrine/annotations), not anything this module requires directly, so
        # there's nothing this repo can do about them beyond waiting on MFTF's own upstream.
        # Real security advisories (a different, more serious flag) still fail the build.
        run: composer audit --no-interaction --abandoned=report

      - name: Run unit tests
        # Show (and fail on) every PHPUnit-level notice/warning/deprecation, not just genuine
        # test failures — PHPUnit's default behavior is to print a one-line "OK, but there were
        # issues!" summary and still exit 0, which silently hides real signal (e.g. PHPUnit 12's
        # "no expectations configured, use createStub() instead" notices) behind a green check.
        run: >-
          vendor/bin/phpunit
          --display-phpunit-notices --display-notices --display-warnings --display-deprecations
          --fail-on-phpunit-notice --fail-on-notice --fail-on-warning --fail-on-deprecation

  unit-tests:
    # A deliberately trivial aggregator, not the real test run (that's unit-tests-php above) —
    # exists only so the required-status-check context stays exactly "unit-tests", the literal
    # string `main`'s branch protection already requires (see AGENTS.md's "PRs auto-merge once CI
    # is green"). A matrixed job reports as "unit-tests-php (8.3)" etc., which would silently stop
    # satisfying that check — renaming the branch-protection entry itself instead was considered
    # and rejected: AGENTS.md already flags branch-protection edits as the kind of change a past
    # session treated as too sensitive to make without asking, and this way needs none at all.
    needs: unit-tests-php
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any PHP version in the matrix failed
        # 'skipped' is fine here too - the changes job's own gate decided nothing PHP-relevant
        # changed, so unit-tests-php never ran at all rather than ran and failed.
        if: ${{ needs.unit-tests-php.result != 'success' && needs.unit-tests-php.result != 'skipped' }}
        run: exit 1

  static-analysis-run:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Configure Composer for repo.magento.com
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.infection/extension-installer true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  static-analysis:
    # Same trivial-aggregator trick as unit-tests above - keeps the required-status-check
    # context exactly "static-analysis" regardless of whether static-analysis-run actually ran.
    needs: static-analysis-run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if the real job failed
        if: ${{ needs.static-analysis-run.result != 'success' && needs.static-analysis-run.result != 'skipped' }}
        run: exit 1

  rector-run:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Configure Composer for repo.magento.com
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.infection/extension-installer true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Rector (check only — see rector.php for why no auto-fix here)
        run: composer rector-check

  rector:
    needs: rector-run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if the real job failed
        if: ${{ needs.rector-run.result != 'success' && needs.rector-run.result != 'skipped' }}
        run: exit 1

  coding-standard-run:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Configure Composer for repo.magento.com
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.infection/extension-installer true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPCS (Magento2 coding standard)
        run: vendor/bin/phpcs

      - name: Run PHP-CS-Fixer (formatting)
        # Different role than PHPCS above: PHPCS only detects violations, this actually rewrites
        # files — so it needs --dry-run --diff to just check without silently "fixing" (and thus
        # masking) an unformatted commit in CI. `composer cs-fix` (no dry-run) is what a
        # contributor runs locally to actually apply it.
        run: composer cs-check

      - name: Run Adobe Commerce Marketplace's code sniffer (EQP gate)
        # The bare `Magento2` ruleset, the way Adobe's Extension Quality Program technical review
        # actually runs it — not this repo's own phpcs.xml.dist, which deliberately excludes a few
        # rule families (see that file's comments) that aren't a correctness/security concern here.
        # --error-severity=10 --warning-severity=0 matches EQP's own pass/fail bar: only severity-10
        # findings block a Marketplace submission, so that's the only thing this step fails CI on.
        # --ignore-annotations because EQP's scan ignores `phpcs:ignore` the same way.
        run: composer phpcs-marketplace-check

  coding-standard:
    needs: coding-standard-run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if the real job failed
        if: ${{ needs.coding-standard-run.result != 'success' && needs.coding-standard-run.result != 'skipped' }}
        run: exit 1

  fuzz-group-walker:
    # Coverage-guided fuzzing (nikic/php-fuzzer) of GroupWalker::walk() - the shared AND/OR/
    # nested-group tree-walk behind every campaign/segment condition evaluation, fed the same
    # JSON-condition-list shape an inbound webhook's or an imported campaign's payload becomes
    # once decoded (see Test/Fuzz/group_walker_target.php's own docblock for why this target and
    # not a public, unauthenticated endpoint - those don't do enough custom parsing to be worth
    # fuzzing). Not in the unit-tests/static-analysis/rector/coding-standard required-check set
    # and deliberately non-blocking (continue-on-error) for now, same as mutation-testing started
    # non-blocking to get an honest first baseline before gating on it - a brand-new tool, not
    # yet proven not to flag its own false positives on this target.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Configure Composer for repo.magento.com
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.infection/extension-installer true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run php-fuzzer against GroupWalker (bounded, 20000 runs)
        run: composer fuzz-check

      - name: Upload crash files, if any
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-fuzzer-crashes
          path: crash-*.txt
          retention-days: 30

  trigger-release:
    # One of 4 identical calls (see coverage.yml/api-tests.yml/integration-tests.yml) - release.yml
    # itself de-dupes multiple firings for the same commit (see its own comment). needs: these 4
    # specific jobs, not e.g. unit-tests-php/static-analysis-run/etc. directly, because those are
    # the ones each already resolve to a definite success/failure and never "skipped" (they're the
    # if: always() trivial aggregators a changes-gated path-filter skip could otherwise propagate
    # through) - see their own comments. github.event_name == 'push' (not pull_request) is what
    # actually makes this unreachable from a fork: a fork cannot push to this repo's main branch,
    # so there is no externally-controlled commit for release.yml to ever act on. Replaces the old
    # workflow_run trigger - see ADR 0077.
    needs: [unit-tests, static-analysis, rector, coding-standard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
