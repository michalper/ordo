name: CI

# Fast lane only: unit tests (Test/Unit) and static analysis. Neither needs a live Magento
# install — Test/Unit mocks every Magento dependency, and PHPStan (bitexpert/phpstan-magento)
# only needs the framework/module *classes* available via Composer, not a running store.
# Test/Integration, Test/Api, and MFTF are NOT run here: they require a real, installed Magento
# application (database, env.php, and for MFTF a browser + webserver) — see AGENTS.md for how
# to run those against the docker-compose environment in magento-ordo-test/. Wiring a full
# Magento install into CI is a real, separate decision (build time, service containers), not
# something folded into this workflow — see ROADMAP.md.
#
# Requires two repository secrets — MAGENTO_COMPOSER_USERNAME / MAGENTO_COMPOSER_PASSWORD —
# because magento/framework and magento/module-* are not on public Packagist, only on
# repo.magento.com. Get a free public/private key pair from a Marketplace account at
# https://marketplace.magento.com (Home → My Profile → Access Keys), no purchase required for
# Open Source packages. Add them as Settings → Secrets and variables → Actions → New repository
# secret. Without them, the "Install dependencies" step below fails with a 401 from
# repo.magento.com — that's expected until the secrets are set, not a bug in this workflow.
#
# Two PR trigger paths, deliberately kept separate rather than one blanket switch:
# - pull_request: the normal, safe path for anyone's PR — GitHub withholds Actions secrets from
#   these runs by design (this is what makes it safe to run untrusted PR code at all).
# - pull_request_target: runs in main's context WITH secrets, but every job below is gated to
#   only actually execute when the PR's author is dependabot[bot] AND its branch starts with
#   "dependabot/" on this event (github.actor alone is a weaker, spoofable signal — SonarCloud's
#   githubactions:S8232 flagged that in an earlier version of this check). Dependabot's own
#   PRs get zero secrets under plain pull_request (a hard GitHub restriction, no per-repo
#   opt-out) even though the bump itself is low-risk and worth actually verifying — this trades
#   a real security surface (a compromised dependency version *could* run code with these
#   secrets during composer install) for that verification, scoped as tightly as possible to
#   just Dependabot rather than every external contributor's PR.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  pull_request_target:
    branches: [main, master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name != 'pull_request_target' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]' &&
       startsWith(github.event.pull_request.head.ref, 'dependabot/'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Configure Composer for repo.magento.com
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Audit dependencies for known vulnerabilities
        # --abandoned=report: still shown, but doesn't fail the build — the abandoned packages
        # here are transitive dependencies of magento/magento2-functional-testing-framework
        # (laminas/*, doctrine/annotations), not anything this module requires directly, so
        # there's nothing this repo can do about them beyond waiting on MFTF's own upstream.
        # Real security advisories (a different, more serious flag) still fail the build.
        run: composer audit --no-interaction --abandoned=report

      - name: Run unit tests
        # Show (and fail on) every PHPUnit-level notice/warning/deprecation, not just genuine
        # test failures — PHPUnit's default behavior is to print a one-line "OK, but there were
        # issues!" summary and still exit 0, which silently hides real signal (e.g. PHPUnit 12's
        # "no expectations configured, use createStub() instead" notices) behind a green check.
        run: >-
          vendor/bin/phpunit
          --display-phpunit-notices --display-notices --display-warnings --display-deprecations
          --fail-on-phpunit-notice --fail-on-notice --fail-on-warning --fail-on-deprecation

  static-analysis:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name != 'pull_request_target' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]' &&
       startsWith(github.event.pull_request.head.ref, 'dependabot/'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Configure Composer for repo.magento.com
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  coding-standard:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name != 'pull_request_target' && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.user.login == 'dependabot[bot]' &&
       startsWith(github.event.pull_request.head.ref, 'dependabot/'))
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Configure Composer for repo.magento.com
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPCS (Magento2 coding standard)
        run: vendor/bin/phpcs
