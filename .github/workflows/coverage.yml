name: PHP Coverage Report

# Same "fast lane" scope and same repo.magento.com auth requirement as ci.yml — see the comment
# at the top of that file. This workflow needs two repository secrets (Settings -> Secrets and
# variables -> Actions -> New repository secret), neither ever committed anywhere in this repo:
# - CODECOV_TOKEN, pasted from your Codecov project's setup page.
# - SONAR_TOKEN, a SonarQube Cloud user token (My Account -> Security -> Generate Token).
#   sonar-project.properties (repo root) has the project/organization keys; this workflow only
#   needs to run the scanner after coverage.clover.xml exists so php.coverage.reportPaths can
#   pick it up. Requires the michalper_ordo project's Analysis Method set to "CI-based" in
#   SonarCloud (Administration -> Analysis Method) — coverage import only works in that mode,
#   not with the GitHub App's automatic analysis.

# Single PR trigger path — see the matching comment in ci.yml for the full reasoning: we tried
# pull_request_target to give Dependabot's own PRs secret access, but SonarCloud's
# githubactions:S7631 flags checking out a PR's head ref under pull_request_target categorically,
# regardless of how the actor is verified. Reverted to plain pull_request; Dependabot PRs get a
# red check here (no secrets, expected), in exchange for a clean Security Rating on main.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          coverage: xdebug

      - name: Configure Composer for repo.magento.com
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.infection/extension-installer true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit with coverage
        # Same strict notice/warning/deprecation handling as ci.yml's unit-tests job — see the
        # comment there for why. --log-junit feeds the Test Analytics upload step below.
        run: >-
          vendor/bin/phpunit --coverage-clover clover.xml --log-junit junit.xml
          --display-phpunit-notices --display-notices --display-warnings --display-deprecations
          --fail-on-phpunit-notice --fail-on-notice --fail-on-warning --fail-on-deprecation

      - name: Upload test results to Codecov
        # Codecov Test Analytics: tracks flaky/failing tests over time from the same JUnit XML
        # report every CI system already produces, separate from (and uploaded regardless of)
        # the line-coverage report below — runs even if the PHPUnit step above failed, so a run
        # that fails on a real test failure still gets its results recorded.
        # codecov/test-results-action is deprecated in favor of codecov-action itself with
        # report_type: test_results (Codecov's own recommendation, surfaced directly on this
        # workflow's own run summary) — same action already used for coverage below, just a
        # second invocation with a different report_type and file.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          report_type: test_results
          flags: unittests
          slug: michalper/ordo

      - name: Upload coverage to Codecov
        # Bumped from v5.1.2 after a real CI failure: Codecov's own CLI-signing key rotated and
        # the old action's embedded wrapper couldn't verify it ("gpg: Can't check signature: No
        # public key") — a Codecov-side issue, not this repo's config; v7 ships an updated
        # wrapper that trusts the current key.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./clover.xml
          flags: unittests
          slug: michalper/ordo
          fail_ci_if_error: true

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  mutation-testing:
    # Separate job, not a step in `coverage` above — Infection re-runs the whole unit suite once
    # per surviving mutant, which is a materially different (much longer) cost profile than a
    # single coverage pass, and infection.json5's minMsi/minCoveredMsi are deliberately 0 for now
    # (see that file's own comment): this job is here to start reporting a real Mutation Score
    # Indicator for the first time, not to gate merges on a threshold nobody has measured yet.
    # continue-on-error keeps that non-blocking even once a real min-msi is set — flip it off at
    # the same time a real threshold goes in, if the team wants this to start failing builds.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          coverage: xdebug

      - name: Configure Composer for repo.magento.com
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.infection/extension-installer true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Infection
        run: vendor/bin/infection --threads=$(nproc) --logger-github --no-interaction

      - name: Upload mutation testing log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-report
          path: |
            infection.log
            infection-summary.log
          retention-days: 30
