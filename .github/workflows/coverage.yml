name: PHP Coverage Report

# Same "fast lane" scope and same repo.magento.com auth requirement as ci.yml — see the comment
# at the top of that file. This workflow needs two repository secrets (Settings -> Secrets and
# variables -> Actions -> New repository secret), neither ever committed anywhere in this repo:
# - CODECOV_TOKEN, pasted from your Codecov project's setup page.
# - SONAR_TOKEN, a SonarQube Cloud user token (My Account -> Security -> Generate Token).
#   sonar-project.properties (repo root) has the project/organization keys; this workflow only
#   needs to run the scanner after coverage.clover.xml exists so php.coverage.reportPaths can
#   pick it up. Requires the michalper_ordo project's Analysis Method set to "CI-based" in
#   SonarCloud (Administration -> Analysis Method) — coverage import only works in that mode,
#   not with the GitHub App's automatic analysis.

# Single PR trigger path — see the matching comment in ci.yml for the full reasoning: we tried
# pull_request_target to give Dependabot's own PRs secret access, but SonarCloud's
# githubactions:S7631 flags checking out a PR's head ref under pull_request_target categorically,
# regardless of how the actor is verified. Reverted to plain pull_request.
#
# CODECOV_TOKEN/SONAR_TOKEN below resolve from the repo's Dependabot secret store (Settings ->
# Secrets and variables -> Dependabot), not the Actions one, for a Dependabot-triggered pull_request
# run — same mechanism already relied on for MAGENTO_COMPOSER_USERNAME/PASSWORD below and in
# ci.yml. See ADR 0074 for how this was confirmed (not "no secrets for Dependabot" — that claim was
# wrong) and why pull_request_target was never needed for this.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:

# Least-privilege default (OpenSSF Scorecard's Token-Permissions check) - nothing in this
# workflow needs more than reading the checked-out code.
permissions:
  contents: read

# A superseded run (an older commit on the same PR/branch) is cancelled outright rather than
# left to finish - its result would never matter once a newer commit's run exists for the same
# ref, so letting it keep consuming a runner is pure waste.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Same path-filter gate ci.yml's own "changes" job uses - see that file's comment for the
    # full reasoning. Deliberately only gates mutation-testing below, not php-coverage/js-coverage/
    # sonar: those three feed the Codecov App's own codecov/patch and codecov/project required
    # checks, which Codecov itself posts asynchronously once it receives an upload - skipping the
    # upload for a docs-only PR risks leaving those two checks stuck "pending" forever (no new
    # report ever arrives for that commit), which would block merge instead of unblocking it. Not
    # worth that risk for three comparatively fast jobs; mutation-testing has no such external
    # dependency and is consistently the slowest job in this entire repo's CI.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.filter.outputs.code || steps.default.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect whether anything besides Markdown docs changed
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - '!**/*.md'

      - name: Default to "code changed" for non-pull_request events
        id: default
        if: github.event_name != 'pull_request'
        run: echo "code=true" >> "$GITHUB_OUTPUT"

  php-coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Configure Composer for repo.magento.com
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.infection/extension-installer true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit with coverage
        # Same strict notice/warning/deprecation handling as ci.yml's unit-tests job — see the
        # comment there for why. --log-junit feeds the Test Analytics upload step below.
        run: >-
          vendor/bin/phpunit --coverage-clover clover.xml --log-junit junit.xml
          --display-phpunit-notices --display-notices --display-warnings --display-deprecations
          --fail-on-phpunit-notice --fail-on-notice --fail-on-warning --fail-on-deprecation

      - name: Upload test results to Codecov
        # Codecov Test Analytics: tracks flaky/failing tests over time from the same JUnit XML
        # report every CI system already produces, separate from (and uploaded regardless of)
        # the line-coverage report below — runs even if the PHPUnit step above failed, so a run
        # that fails on a real test failure still gets its results recorded.
        # codecov/test-results-action is deprecated in favor of codecov-action itself with
        # report_type: test_results (Codecov's own recommendation, surfaced directly on this
        # workflow's own run summary) — same action already used for coverage below, just a
        # second invocation with a different report_type and file.
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          report_type: test_results
          flags: unittests
          slug: michalper/ordo

      - name: Upload coverage to Codecov
        # Bumped from v5.1.2 after a real CI failure: Codecov's own CLI-signing key rotated and
        # the old action's embedded wrapper couldn't verify it ("gpg: Can't check signature: No
        # public key") — a Codecov-side issue, not this repo's config; v7 ships an updated
        # wrapper that trusts the current key.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./clover.xml
          flags: unittests
          slug: michalper/ordo
          fail_ci_if_error: true

      - name: Upload clover report for Sonar
        # Handed off to the sonar job below, which can't regenerate this itself without
        # re-running the whole PHPUnit suite — passing the artifact is materially cheaper than
        # running php-coverage and sonar sequentially in one job, which is exactly the split
        # this workflow makes.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php-coverage-report
          path: clover.xml
          retention-days: 1

  js-coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        # For the handful of hand-rolled AMD modules under view/**/web/js (Test/js/ + package.json
        # at repo root) - this project is otherwise pure PHP/Composer, so Node only shows up here.
        # See package.json's own description for why this exists at all.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Run JS unit tests with coverage
        # --ignore-scripts: none of qunit/jquery/jsdom/c8 need an install-time lifecycle script
        # (no native addons to compile), so there's nothing to lose by refusing to run arbitrary
        # postinstall/preinstall scripts from the dependency tree - a real SonarCloud finding
        # (githubactions:S6505) on the very first version of this step, not a hypothetical one.
        run: |
          npm ci --ignore-scripts
          npm run test:js:coverage

      - name: Upload lcov report for Sonar
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-coverage-report
          path: coverage-js/lcov.info
          retention-days: 1

  sonar:
    # Waits on both coverage jobs so php.coverage.reportPaths / javascript.lcov.reportPaths have
    # something to import — this is the only reason php-coverage and js-coverage can't just run
    # standalone; splitting them out is what lets those two run in parallel instead of back to
    # back in a single job.
    needs: [php-coverage, js-coverage]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download PHP coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php-coverage-report

      - name: Download JS coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: js-coverage-report
          path: coverage-js

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The scan step above only submits the analysis - it always succeeds regardless of what
      # it finds, so a new Sonar issue (a code smell, a dropped coverage/duplication threshold
      # on new code, ...) was never actually failing this job on its own; only SonarCloud's own
      # dashboard showed it, after the fact. This polls the just-submitted analysis for its real
      # Quality Gate result (New Code conditions: 0 new bugs/vulnerabilities, maintainability
      # rating, etc. - see the project's own Quality Gate settings on sonarcloud.io) and fails the
      # job if it's not PASSED, so a new-code issue actually blocks the PR instead of only
      # showing up for someone to notice later.
      - name: SonarQube Cloud Quality Gate check
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  mutation-testing-run:
    # Separate job, not a step in `coverage` above — Infection re-runs the whole unit suite once
    # per surviving mutant, which is a materially different (much longer) cost profile than a
    # single coverage pass. Ran non-blocking (continue-on-error) for a while to get a first honest
    # MSI baseline with nobody gating on it yet: 5 consecutive runs across main and feature
    # branches all landed at the same 4943/7043 = ~70.2% MSI (infection.json5's minMsi/
    # minCoveredMsi were 0 during that period — see git history for that file). Now blocking,
    # gated at 70 (a couple points under the measured baseline, so normal run-to-run mutant
    # selection order doesn't flip a PR red for no real regression).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: xdebug

      - name: Cache Composer packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Configure Composer for repo.magento.com
        env:
          MAGENTO_COMPOSER_USERNAME: ${{ secrets.MAGENTO_COMPOSER_USERNAME }}
          MAGENTO_COMPOSER_PASSWORD: ${{ secrets.MAGENTO_COMPOSER_PASSWORD }}
        run: |
          composer config repositories.magento composer https://repo.magento.com
          composer config http-basic.repo.magento.com "$MAGENTO_COMPOSER_USERNAME" "$MAGENTO_COMPOSER_PASSWORD"
          composer config allow-plugins.magento/composer-dependency-version-audit-plugin true
          composer config allow-plugins.magento/magento-composer-installer true
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer config allow-plugins.infection/extension-installer true

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Infection
        run: vendor/bin/infection --threads="$(nproc)" --logger-github --no-interaction

      - name: Upload mutation testing log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infection-report
          path: |
            infection.log
            infection-summary.log
          retention-days: 30

  mutation-testing:
    # Same trivial-aggregator trick as ci.yml's own unit-tests/static-analysis/rector/
    # coding-standard - keeps the required-status-check context exactly "mutation-testing"
    # regardless of whether mutation-testing-run actually ran.
    needs: mutation-testing-run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if the real job failed
        if: ${{ needs.mutation-testing-run.result != 'success' && needs.mutation-testing-run.result != 'skipped' }}
        run: exit 1

  trigger-release:
    # See ci.yml's own "trigger-release" job for the full reasoning (one of 4 identical calls).
    # php-coverage/js-coverage/sonar never go through the changes path-filter (see this file's own
    # "changes" job comment on why) so they always resolve success/failure on their own; only
    # mutation-testing-run does, hence depending on its if: always() aggregator here too.
    needs: [php-coverage, js-coverage, sonar, mutation-testing]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      id-token: write
      artifact-metadata: write
      attestations: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
