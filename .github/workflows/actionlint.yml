name: actionlint

# Lints every .github/workflows/*.yml file on every change - this exact tool was run by hand,
# manually, throughout this repo's own CI work (catching real shellcheck findings and YAML
# mistakes before they ever reached a real run) with nothing ever wiring it into CI itself.
# reporter: local needs no extra token permissions beyond the default contents: read - no PR
# annotations, just a normal job failure (red X) the same way any other lint step here works.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@ae857e78c1b42b3d0a49637181b09d3d56d402b4 # v1.84.1
        with:
          reporter: local
          fail_level: error
