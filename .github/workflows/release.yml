name: Auto-release

# Automates "Cutting a release" (CONTRIBUTING.md): tags the commit and publishes a matching
# GitHub Release off docs/CHANGELOG.md's own newest dated section, together, in one step, the
# same thing scripts/release.sh already does by hand - so nobody has to remember to run it after
# a CHANGELOG-update PR merges to main. Forgetting that manual step is exactly what once left
# 1.6.0 tagged with no visible entry on the Releases page (see scripts/release.sh's own comment).
# See ADR 0077 for the trade-offs this design accepts (updated there: this used to trigger on
# workflow_run; see that ADR for why it moved to workflow_call).
#
# Called (workflow_call) as the last job of each of the 4 CI workflows (ci.yml, coverage.yml,
# api-tests.yml, integration-tests.yml) once ALL of that workflow's own required checks have
# passed on a direct push to main - never on pull_request, and never reachable from a fork, since
# a fork cannot push to this repo's main branch at all. A release must never be cut off a commit
# before its own CI has actually gone green, the same gate scripts/release.sh already enforces for
# a manual release. Each of the 4 callers finishing fires this once, so it can run up to 4 times
# for the same commit; harmless, since the already-tagged check below makes every run after the
# first a no-op, and the all-green check (still needed - the OTHER 3 workflows run in parallel and
# may not have finished yet) makes an early firing a no-op too, retried by whichever of the
# remaining 3 finishes last.
#
# Does nothing when docs/CHANGELOG.md's newest dated section (right after "## [Unreleased]") is
# already tagged - i.e. on every ordinary push that isn't itself a "cut a release" PR.
#
# Known limitation (see ADR 0077): if update-site fails after release already tagged/published
# (e.g. a transient Anthropic/WIF outage), there's no automatic retry - that version is
# permanently past the "already tagged" gate, so a later run can never re-fire update-site for it.
# Recover manually: re-run just the update-site job from this workflow's own Actions UI (Actions
# -> this run -> "Re-run jobs" -> "Re-run failed jobs"), which works because update-site's own
# steps are themselves idempotent (re-running a successful ordo-site PR+merge would just fail
# harmlessly on a duplicate branch name - safe to retry).
#
# Second known limitation, found cutting 1.15.0: update-site's own "has_bullets" check can be a
# false negative, not just the HTTP-failure case above - the Claude API call itself returned 200
# with the CHANGELOG section verbatim as input (two clearly user-visible new storefront widgets),
# but `.content[0].text` came back empty, so the job concluded "nothing user-visible" and exited 0
# (a genuine success, not a failure - the "re-run failed jobs" recovery above doesn't even apply).
# A manual re-run of the same job reproduced the exact same empty-bullets outcome a second time.
# Root cause not confirmed (the raw /tmp/claude-response.json is gone by the time this is
# noticed), but the prompt's own "if truly nothing in the section is user-visible, output nothing
# at all" instruction is the most likely culprit - skip-on-doubt phrasing failing closed on an
# input that actually did warrant bullets. Recovery used both times so far: draft the
# plain-language bullets by hand, in the same voice, and open the ordo-site PR manually (see that
# repo's own #3 and #4).
#
# Third known limitation, found cutting 1.16.0: a genuine failure, not a false negative this
# time - the Claude-drafted bullets were correct and the changelog.html commit/push to
# ordo-site's own branch succeeded, but the final `gh pr create` step failed with "error checking
# for existing pull request: GraphQL: Resource not accessible by personal access token
# (repository.pullRequests)". ORDO_SITE_TOKEN (this job's own comment above documents its
# required scopes: Contents Read & write, Pull requests Read & write) had lost - or never
# actually had - the Pull requests scope on michalper/ordo-site; fine-grained PATs can silently
# drop a scope on renewal/re-approval, unlike classic PATs. The commit/push half of this job is
# idempotent and already succeeded by this point, so recovery is: open+merge the already-pushed
# release-notes/<version> branch manually (see ordo-site's own #5), and separately re-check/
# regenerate ORDO_SITE_TOKEN's scopes (GitHub -> Settings -> Developer settings -> Personal
# access tokens -> Fine-grained tokens) before the next release needs this job to actually
# succeed end to end.

on:
  workflow_call:

# Least-privilege default (OpenSSF Scorecard's Token-Permissions check); the one job that
# actually needs to push a tag and create a release raises it at job level instead.
permissions:
  contents: read

# Keyed on the commit, not the ref - up to 4 of this workflow's own runs can fire for the same
# commit (see the comment above), and two running at once could race past the "already tagged"
# check before either pushes the tag. cancel-in-progress stays false: cancelling one mid-tag-push
# or mid-cross-repo-PR would be worse than letting it queue behind the one already running.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    # Defense in depth only - the caller's own trigger-release job already restricts this to a
    # direct push to main (github.event_name == 'push'), which a fork cannot produce at all (forks
    # can't push to this repo's main branch), so there is no externally-controlled SHA to guard
    # against here the way the old workflow_run-triggered version had to (SonarCloud
    # githubactions:S7631, OpenSSF Scorecard's Dangerous-Workflow check - see ADR 0077).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write # cosign's keyless signing (scripts/sign-release.sh) and actions/attest's
      # SLSA provenance (below) both exchange this for a short-lived Sigstore certificate - no
      # persistent private key involved either way. See docs/ASSURANCE_CASE.md and SECURITY.md's
      # "Verifying a release".
      attestations: write # actions/attest: persists the provenance attestation.
      artifact-metadata: write # actions/attest: creates the artifact storage record.
    outputs:
      released: ${{ steps.publish.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.publish.outputs.notes }}
    steps:
      # No ref: override - checks out github.sha, which in a workflow_call job is the exact same
      # commit the calling push event fired for. fetch-depth left at the default (shallow, depth
      # 1) - nothing below reads git history, only docs/CHANGELOG.md's working-tree content and
      # the remote's own tags/check-runs via the API.
      - name: Checkout main at the commit CI just finished for
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Determine the newest dated CHANGELOG version
        id: version
        run: |
          version="$(awk '/^## \[Unreleased\]/ { found=1; next } found && /^## \[/ { print; exit }' docs/CHANGELOG.md | sed -E 's/^## \[([^]]+)\].*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -z "$version" ]]; then
            echo "No dated release section right after [Unreleased] - nothing to release."
          else
            echo "Newest dated CHANGELOG section: $version"
          fi

      - name: Skip if that version is already tagged
        id: check
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if scripts/is-tagged.sh "$VERSION"; then
            echo "already_tagged=true" >> "$GITHUB_OUTPUT"
            echo "$VERSION is already tagged - nothing to do."
          else
            echo "already_tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify every check for this commit is green
        id: gate
        if: steps.version.outputs.version != '' && steps.check.outputs.already_tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          if scripts/ci-green.sh "$SHA"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Whichever of the other triggering workflows finishes last will retry this."
          fi

      - name: Tag and publish the GitHub Release
        id: publish
        if: steps.version.outputs.version != '' && steps.check.outputs.already_tagged == 'false' && steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes_file="$(mktemp)"
          scripts/changelog-section.sh "$VERSION" > "$notes_file"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/tag-and-release.sh "$VERSION" "$notes_file"
          scripts/sign-release.sh "$VERSION"

          # Randomized delimiter: this content comes from docs/CHANGELOG.md, so a line that
          # happened to equal a static delimiter would terminate the block early and let
          # whatever follows it be parsed as extra, attacker- or accident-influenced step
          # outputs - a known GitHub Actions output-injection footgun.
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "notes<<$delim"
            cat "$notes_file"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "Tagged and published $VERSION: https://github.com/${{ github.repository }}/releases/tag/$VERSION"

      - name: Generate SLSA build provenance for the release archive
        id: attest
        if: steps.publish.outputs.released == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ordo-${{ steps.version.outputs.version }}.tar.gz

      - name: Upload the provenance attestation as a release asset
        # OpenSSF Scorecard's Signed-Releases check only looks at release ASSET filenames (an
        # exact *.intoto.jsonl suffix, nothing more - see its own releasesHaveProvenance probe),
        # not GitHub's separate Artifact Attestations API the step above already published to -
        # so the same real SLSA/in-toto attestation (just produced via GitHub's current,
        # Sigstore-bundle-based actions/attest rather than the classic bare .intoto.jsonl writer)
        # needs a copy attached to the release itself, under that exact suffix, for Scorecard to
        # credit it. gh attestation verify (or cosign verify-blob) both still work against it
        # either way - this doesn't change what's being verified, just where a copy of it lives.
        if: steps.publish.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          provenance_file="ordo-$VERSION.tar.gz.intoto.jsonl"
          cp "$BUNDLE_PATH" "$provenance_file"
          gh release upload "$VERSION" "$provenance_file"

  update-site:
    # Mirrors the just-cut release onto ordo-site/changelog.html (ordo.marketing) - the one step
    # of "Cutting a release" (CONTRIBUTING.md) the release job above can't do by reusing the
    # CHANGELOG verbatim, since that file's own entries are deliberately technical (class/method
    # names, ADR references) and changelog.html's are deliberately NOT (see its own existing
    # entries) - so this asks Claude to rewrite this release's CHANGELOG section into 1-4 short,
    # plain-language bullets in that established voice, then opens a PR on ordo-site with the
    # result and merges it immediately (no human review step, by explicit instruction - this
    # repo's maintainer would otherwise have to review every single release by hand, defeating
    # the point of automating this at all). See ADR 0077.
    #
    # Claude's own output is never trusted as markup, regardless of what it returns: the
    # "Insert the new release block" step below HTML-escapes every line itself and wraps it in
    # <li> there, so there is no way for the model (or anything upstream of it, like a crafted
    # CHANGELOG entry) to inject a tag/attribute into a live public page.
    #
    # Authenticates to the Claude API via Workload Identity Federation (console.anthropic.com ->
    # Settings -> Workload identity -> federation rule "ordo-release-workflow", service account
    # "ordo-release-notes-rewriter") - a short-lived token minted per run from this job's own
    # GitHub OIDC identity, not a long-lived ANTHROPIC_API_KEY secret. The federation rule is
    # pinned to this exact repo (michalper/ordo, by both name and immutable owner id) and to
    # refs/heads/main, so only this workflow's own runs on main can ever mint a token - never a
    # fork's pull_request run (whose own ref claim is refs/pull/N/merge, which never matches).
    #
    # Needs one repository secret not committed anywhere in this repo:
    # - ORDO_SITE_TOKEN: a fine-grained PAT (Settings -> Developer settings -> Personal access
    #   tokens -> Fine-grained) scoped to ONLY the michalper/ordo-site repo, with Contents:
    #   Read & write and Pull requests: Read & write - the default GITHUB_TOKEN can't touch a
    #   different repository.
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout ordo-site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: michalper/ordo-site
          token: ${{ secrets.ORDO_SITE_TOKEN }}
          path: ordo-site

      - name: Fetch GitHub OIDC token for Anthropic's WIF issuer
        env:
          ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-anthropic-jwt
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"

      - name: Exchange it for a short-lived Anthropic access token
        id: anthropic_token
        env:
          # IDs that route a federation request to the right rule/service-account/workspace -
          # not secrets (see this job's own comment: the federation rule itself is what actually
          # gates who can mint a token, by repo/ref/owner-id, regardless of who knows these IDs).
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_01RjwUQdqfoNHK3Dfz4Y3q7Z
          ANTHROPIC_ORGANIZATION_ID: 33e309c0-8281-4c45-b19f-5ee1a45e7a0a
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_0122Q3QvzxctAnWVsYMR7j4o
          ANTHROPIC_WORKSPACE_ID: wrkspc_01SaHM5rCoxs81NixmshgpYp
        run: |
          jwt="$(cat /tmp/gha-anthropic-jwt)"
          http_code="$(jq -n --arg assertion "$jwt" \
            --arg rule "$ANTHROPIC_FEDERATION_RULE_ID" \
            --arg org "$ANTHROPIC_ORGANIZATION_ID" \
            --arg svc "$ANTHROPIC_SERVICE_ACCOUNT_ID" \
            --arg ws "$ANTHROPIC_WORKSPACE_ID" \
            '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: $assertion,
              federation_rule_id: $rule, organization_id: $org, service_account_id: $svc,
              workspace_id: $ws}' | \
            curl -sS -o /tmp/anthropic-token-response.json -w '%{http_code}' \
              https://api.anthropic.com/v1/oauth/token \
              -H "content-type: application/json" -d @-)"
          if [[ "$http_code" != "200" ]]; then
            echo "Anthropic token exchange failed with HTTP $http_code - see the authentication log at https://platform.claude.com/settings/workload-identity-federation?tab=history" >&2
            cat /tmp/anthropic-token-response.json >&2
            exit 1
          fi
          access_token="$(jq -r '.access_token // empty' /tmp/anthropic-token-response.json)"
          if [[ -z "$access_token" ]]; then
            echo "Anthropic token exchange returned HTTP 200 but no access_token" >&2
            exit 1
          fi
          echo "::add-mask::$access_token"
          echo "access_token=$access_token" >> "$GITHUB_OUTPUT"

      - name: Ask Claude to rewrite it in changelog.html's own plain-language voice
        id: rewrite
        env:
          ANTHROPIC_ACCESS_TOKEN: ${{ steps.anthropic_token.outputs.access_token }}
          CHANGELOG_SECTION: ${{ needs.release.outputs.notes }}
        run: |
          system_prompt="$(cat <<'PROMPT_EOF'
          You rewrite one technical CHANGELOG.md section (Keep-a-Changelog style, full of
          class/method names and ADR references) into 1-4 short, plain-language bullets for a
          public marketing changelog page, matching the voice of these real past entries exactly
          - matter-of-fact, no hype, describes user-visible impact, never a class/file name,
          never an ADR number:

          - Closed a CSRF gap that could let a malicious page tag a logged-in customer's account with attacker-chosen data.
          - More resilient campaign scheduling - a failing step in a delayed/quiet-hours campaign no longer risks re-running earlier steps on retry.
          - Zero-party-data surveys now render on the storefront for a custom text/choice question too, not just the NPS score - matching what the campaign builder already let you configure.

          Output ONLY the new bullets as plain text, one per line, nothing else - no HTML tags, no
          markdown, no code fences, no leading dash or bullet marker, no preamble, no explanation
          (the caller adds its own <li> wrapper and escapes the text, so raw markup you emit would
          just render as literal text, not as a tag). Skip anything with zero user-visible effect
          (internal refactors, test-only changes, CI changes) - if truly nothing in the section is
          user-visible, output nothing at all.
          PROMPT_EOF
          )"

          http_code="$(jq -n --arg sys "$system_prompt" --arg user "$CHANGELOG_SECTION" \
            '{model: "claude-sonnet-5", max_tokens: 1024, system: $sys, messages: [{role: "user", content: $user}]}' | \
            curl -sS -o /tmp/claude-response.json -w '%{http_code}' \
              https://api.anthropic.com/v1/messages \
              -H "authorization: Bearer $ANTHROPIC_ACCESS_TOKEN" \
              -H "anthropic-version: 2026-10-21" \
              -H "content-type: application/json" \
              -d @-)"

          if [[ "$http_code" != "200" ]]; then
            echo "Claude API call failed with HTTP $http_code - not touching ordo-site." >&2
            cat /tmp/claude-response.json >&2
            echo "has_bullets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bullets="$(jq -r '.content[0].text // empty' /tmp/claude-response.json)"

          if [[ -z "$bullets" ]]; then
            echo "Claude returned no bullets - nothing user-visible to add. Not touching ordo-site." >&2
            echo "has_bullets=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Randomized delimiter - see the "release" job's own comment on this same pattern.
          delim="EOF_$(openssl rand -hex 8)"
          {
            echo "bullets<<$delim"
            echo "$bullets"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "has_bullets=true" >> "$GITHUB_OUTPUT"

      - name: Insert the new release block and open a PR
        if: steps.rewrite.outputs.has_bullets == 'true'
        env:
          GH_TOKEN: ${{ secrets.ORDO_SITE_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          BULLETS: ${{ steps.rewrite.outputs.bullets }}
        run: |
          cd ordo-site
          date="$(date +%Y-%m-%d)"

          anchor='<section class="block" style="border-top:none; padding-top:0;">'
          if ! grep -qF "$anchor" changelog.html; then
            echo "Anchor not found in ordo-site/changelog.html - its markup may have changed; update this workflow's own anchor string. Not touching the file." >&2
            exit 1
          fi

          block_file="$(mktemp)"
          {
            echo "    <div class=\"release\">"
            echo "      <div class=\"release-head\"><span class=\"version\">${VERSION}</span><span class=\"date\">${date}</span></div>"
            echo "      <ul>"
            # Claude's reply is plain text, never trusted as markup - every line is HTML-escaped
            # and wrapped in <li> here, so nothing it returns can ever inject a tag/attribute into
            # the page (a prior version of this step instead only checked the reply looked like
            # "<li>...</li>", which a crafted ".*" payload could satisfy while still containing a
            # live <script> - a real stored-XSS gap on a public page, closed by never trusting the
            # model with markup at all).
            while IFS= read -r line; do
              [[ -z "$line" ]] && continue
              escaped="$(sed -e 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' <<<"$line")"
              printf '        <li>%s</li>\n' "$escaped"
            done <<<"$BULLETS"
            echo "      </ul>"
            echo "    </div>"
            echo
          } > "$block_file"

          awk -v anchor="$anchor" -v blockfile="$block_file" '
            { print }
            index($0, anchor) { while ((getline line < blockfile) > 0) print line }
          ' changelog.html > changelog.html.new
          mv changelog.html.new changelog.html

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="release-notes/$VERSION"
          git checkout -b "$branch"
          git add changelog.html
          git commit -m "Add $VERSION to the changelog (auto-drafted by ordo's release.yml, no human review by design)"
          git push origin "$branch"
          gh pr create --repo michalper/ordo-site --title "changelog: add $VERSION" \
            --body "Auto-drafted from [ordo's CHANGELOG](https://github.com/michalper/ordo/releases/tag/$VERSION) by ordo's own release.yml - see that workflow for how." \
            --head "$branch" --base master
          gh pr merge --repo michalper/ordo-site "$branch" --squash --delete-branch
