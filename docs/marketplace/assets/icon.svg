<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Same mark + gradient as .github/assets/hero.svg (README) and view/adminhtml/web/images/icon.svg
       (admin menu), so the brand reads consistently across every surface it appears on, rather than
       being redrawn per surface. Square listing icon: mark + wordmark, no slogan/feature text, no
       Adobe/Magento name or logo, per Adobe's icon content rule. -->
  <defs>
    <linearGradient id="ordoIconMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#0F172A" />
  <circle cx="256" cy="200" r="88" fill="none" stroke="url(#ordoIconMark)" stroke-width="16" />
  <circle cx="256" cy="200" r="28" fill="url(#ordoIconMark)" />
  <text x="256" y="400" text-anchor="middle" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif"
        font-size="84" font-weight="600" fill="#F8FAFC">Ordo</text>
</svg>
