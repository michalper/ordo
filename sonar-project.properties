sonar.projectKey=michalper_ordo
sonar.organization=michalper
sonar.sources=.
sonar.php.coverage.reportPaths=clover.xml
sonar.javascript.lcov.reportPaths=coverage-js/lcov.info
sonar.exclusions=vendor/**,Test/**,node_modules/**,coverage-js/**
sonar.tests=Test
sonar.test.inclusions=Test/**/*Test.php

# Coverage-metric-only exclusions (still fully analyzed for bugs/smells/duplication - this only
# stops these files from counting as "uncovered lines" toward the coverage percentage). Mirrors
# phpunit.xml.dist's own <source><exclude> for registration.php/rector.php: config/bootstrap files
# read by tooling (Composer's autoload.files, the rector CLI), never executed by anything the test
# suite runs. .phtml templates are rendered by Magento's Block::_toHtml() view layer, which
# Test/Unit never invokes (it mocks the Block layer entirely) - only Test/Integration/Test/Api
# would render them for real, and those deliberately don't run in CI's coverage job (see
# phpunit.xml.dist's own docblock). requirejs-config.js is a plain path-mapping object literal
# consumed by RequireJS's own bootstrap loader, not an application module under test:js's scope.
sonar.coverage.exclusions=**/*.phtml,registration.php,rector.php,view/adminhtml/requirejs-config.js

# githubactions:S5332 ("clear-text protocols") flags .github/workflows/mftf.yml's
# --base-url=http://... — a real finding in general, but a deliberate, justified exception here:
# mftf.yml stands up a throwaway Magento instance inside one GitHub Actions job (fresh MySQL/
# OpenSearch/Selenium containers, torn down when the job ends), with no real users, no real data,
# and no exposure outside the job's own network. Adding TLS to a disposable CI-only test target
# would be pure overhead with no actual security benefit. Not applied to any other file — this is
# the only known instance of this rule in the repo.
#
# Web:S5257 ("<table> should not be used for layout purposes") flags every layout table in
# view/frontend/email/*.html. Correct advice for ordinary web pages; wrong for HTML email —
# table-based layout is the established, deliberate industry practice there specifically because
# major email clients (Outlook's Word rendering engine chief among them) have notoriously weak
# CSS support and routinely strip or mis-render div/flexbox/grid layout. Converting these to
# div-based layout would degrade rendering across real inboxes, not improve it. Scoped to just
# this directory, not a blanket table exclusion — Web:S5256/S1827 (missing <th>, deprecated
# cellspacing/cellpadding attributes) were real, already fixed for real earlier.
#
# php:S101 ("class names should match ^[A-Z][a-zA-Z]*$", i.e. no digits) flags every
# "Customer360"-named class (Model\Customer360\Customer360Snapshot,
# Model\Customer360\Customer360SnapshotBuilder, Controller\Adminhtml\Customer360\
# AbstractCustomer360Action). "Customer 360" is the established, deliberately-chosen business
# term for this feature (see docs/CHANGELOG.md, ROADMAP.md's own "Customer 360 / CDP view"
# candidate this closed) - renaming the classes to something digit-free would only obscure the
# one name anyone (support, sales, the merchant) actually recognizes for this screen. Scoped to
# just these three files, not a blanket S101 exclusion.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/mftf.yml
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S5257
sonar.issue.ignore.multicriteria.e2.resourceKey=view/frontend/email/*.html
sonar.issue.ignore.multicriteria.e3.ruleKey=php:S101
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*Customer360*.php
