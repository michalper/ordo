sonar.projectKey=michalper_ordo
sonar.organization=michalper
sonar.sources=.
sonar.php.coverage.reportPaths=clover.xml
sonar.exclusions=vendor/**,Test/**
sonar.tests=Test
sonar.test.inclusions=Test/**/*Test.php

# githubactions:S5332 ("clear-text protocols") flags .github/workflows/mftf.yml's
# --base-url=http://... — a real finding in general, but a deliberate, justified exception here:
# mftf.yml stands up a throwaway Magento instance inside one GitHub Actions job (fresh MySQL/
# OpenSearch/Selenium containers, torn down when the job ends), with no real users, no real data,
# and no exposure outside the job's own network. Adding TLS to a disposable CI-only test target
# would be pure overhead with no actual security benefit. Not applied to any other file — this is
# the only known instance of this rule in the repo.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=.github/workflows/mftf.yml
