<svg width="20" height="20" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
  <!-- Admin menu mark, same circle+dot form as the README hero's logo mark
       (.github/assets/hero.svg), so the brand reads consistently everywhere
       it appears rather than being redrawn per surface. -->
  <defs>
    <linearGradient id="ordoMenuMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
  </defs>
  <circle cx="18" cy="18" r="16" fill="none" stroke="url(#ordoMenuMark)" stroke-width="3" />
  <circle cx="18" cy="18" r="5" fill="url(#ordoMenuMark)" />
</svg>
